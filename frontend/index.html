<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Who's Free Today?</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <main class="app">

        <!-- Welcome -->
        <section id="welcome-screen" class="screen active">
            <div class="screen-content">
                <div class="logo">👋</div>

                <h1>Who's Free Today?</h1>

                <p class="subtitle">
                    Знайди людей поруч, які теж вільні сьогодні.
                </p>

                <button id="start-button" class="primary-button">
                    🟢 Почати
                </button>
            </div>
        </section>


        <!-- Location -->
        <section id="location-screen" class="screen">
            <div class="screen-content">
                <div class="logo">📍</div>

                <h1>Де ти зараз?</h1>

                <p class="subtitle">
                    Локація допоможе знайти людей поблизу.
                    Точну адресу ми не показуватимемо.
                </p>

                <button id="location-button" class="primary-button">
                    📍 Використати мою локацію
                </button>

                <button id="city-button" class="secondary-button">
                    🌍 Обрати місто вручну
                </button>
            </div>
        </section>
<!-- Profile -->
<section id="profile-screen" class="screen">
    <div class="screen-content">
        <div class="logo">👤</div>

        <h1>Розкажи про себе</h1>

        <p class="subtitle">
            Це допоможе іншим зрозуміти, з ким вони можуть зустрітися.
        </p>

        <div class="form">
            <label for="name-input">Ім'я</label>
            <input
                id="name-input"
                type="text"
                placeholder="Твоє ім'я"
                maxlength="50"
            >

            <label for="age-input">Вік</label>
            <input
                id="age-input"
                type="number"
                placeholder="Наприклад, 25"
                min="18"
                max="100"
            >

            <p class="form-label">Що тобі цікаво?</p>

            <div class="interests">
                <button type="button" class="interest-button">☕ Кава</button>
                <button type="button" class="interest-button">🍺 Бар</button>
                <button type="button" class="interest-button">🚶 Прогулянка</button>
                <button type="button" class="interest-button">🎮 Ігри</button>
                <button type="button" class="interest-button">🎬 Кіно</button>
                <button type="button" class="interest-button">🏃 Спорт</button>
                <button type="button" class="interest-button">🍕 Їжа</button>
                <button type="button" class="interest-button">💬 Поспілкуватися</button>
            </div>

            <button id="save-profile-button" class="primary-button">
                Продовжити →
            </button>
        </div>
    </div>
</section>

    </main>

    <script src="/static/js/telegram.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
